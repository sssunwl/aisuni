<script>
// ── Main Tab ──
document.querySelectorAll('.ntab').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('tab-'+b.dataset.tab).classList.add('on');
  });
});

// ── Sub-Tab (scoped per subtab-group, since there's more than one on the page now) ──
document.querySelectorAll('.stab').forEach(b=>{
  b.addEventListener('click',()=>{
    const group=b.closest('.subtab-group');
    group.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));
    group.querySelectorAll('.spane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('stab-'+b.dataset.stab).classList.add('on');
  });
});


// ── Render helpers ──
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function newsCard(item,badgeCls,badgeTxt){
  return`<div class="card">
    <div class="meta"><span class="badge ${badgeCls}">${esc(badgeTxt||item.source||'新聞')}</span></div>
    <div class="ctitle"><a href="${item.link}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
    ${item.summary?`<div class="csub">${esc(item.summary)}</div>`:''}
  </div>`;
}
function toolCard(item){
  return`<div class="card">
    <div class="meta"><span class="badge b-tool">新工具</span></div>
    <div class="ctitle"><a href="${item.link}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
    ${item.desc?`<div class="csub">${esc(item.desc)}</div>`:''}
  </div>`;
}
function emptyState(msg){
  return`<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
    </svg>${msg}</div>`;
}

// ── Calendar ──
const MONTH_NAMES=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DOW=['一','二','三','四','五','六','日'];
let calYear, calMonth, calData={}, selectedDate=null;

function pad(n){return String(n).padStart(2,'0')}
function dateKey(y,m,d){return`${y}-${pad(m+1)}-${pad(d)}`}

function renderCal(){
  const today=new Date();
  document.getElementById('calTitle').textContent=`${calYear} 年 ${MONTH_NAMES[calMonth]}`;

  const firstDow=(new Date(calYear,calMonth,1).getDay()+6)%7;
  const lastDay=new Date(calYear,calMonth+1,0).getDate();
  let cells='';
  DOW.forEach(d=>{cells+=`<div class="cal-dow">${d}</div>`});
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=lastDay;d++){
    const key=dateKey(calYear,calMonth,d);
    const isToday=calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
    const has=!!calData[key];
    const isSel=selectedDate===key;
    const cls=['cal-cell',isToday?'today':'',has?'has-data':'',isSel?'selected':''].filter(Boolean).join(' ');
    const dot=has?`<span class="cal-dot"></span>`:'';
    cells+=`<div class="${cls}" onclick="selectCal('${key}')">${d}${dot}</div>`;
  }
  document.getElementById('calGrid').innerHTML=cells;
  renderCalPanel();
}

function selectCal(key){
  if(!calData[key]) return;
  selectedDate=selectedDate===key?null:key;
  renderCal();
}

function renderCalPanel(){
  const panel=document.getElementById('calPanel');
  if(!selectedDate||!calData[selectedDate]){
    panel.innerHTML=`<div class="cal-placeholder">選擇日期，查看當天 AI 簡報</div>`;
    return;
  }
  const day=calData[selectedDate];
  const news=[...(day.news||[])].slice(0,6);
  panel.innerHTML=`<div class="cal-panel">
    <div class="cal-panel-date">📅 ${selectedDate} 當日 AI 簡報</div>
    ${news.length?news.map(n=>`<div class="cal-item">
      <a href="${n.link}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="cal-src">${esc(n.source||'')}</div>
    </div>`).join(''):'<div style="color:var(--muted);font-size:13px">暫無記錄</div>'}
    ${day.pick?`<div class="cal-item" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,212,255,.1)">
      <div style="font-size:11px;color:var(--cyan);margin-bottom:4px">💡 今日精選</div>
      <a href="${day.pick.link}" target="_blank" rel="noopener">${esc(day.pick.title)}</a>
    </div>`:''}
    ${day.steve_ideas&&day.steve_ideas.length?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(245,158,11,.15)">
      <div style="font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:600">💰 今日賺錢點子</div>
      ${day.steve_ideas.map((idea,i)=>`<div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:var(--text)">${['1️⃣','2️⃣','3️⃣'][i]} ${esc(idea.title)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:2px">${esc(idea.detail)}</div>
      </div>`).join('')}
    </div>`:''}
  </div>`;
}

document.getElementById('calPrev').addEventListener('click',()=>{
  calMonth--;if(calMonth<0){calMonth=11;calYear--}
  selectedDate=null;renderCal();
});
document.getElementById('calNext').addEventListener('click',()=>{
  calMonth++;if(calMonth>11){calMonth=0;calYear++}
  selectedDate=null;renderCal();
});

  filterEl.innerHTML=[
    `<button class="tfbtn ${activeCat==='all'?'on':''}" onclick="filterTool('all')">全部</button>`,
    ...cats.map(c=>`<button class="tfbtn ${activeCat===c?'on':''}" onclick="filterTool('${c}')">${CAT_META[c].label}</button>`)
  ].join('');
  const tools=activeCat==='all'?AI_TOOLS:AI_TOOLS.filter(t=>t.cat===activeCat);
  document.getElementById('toolGrid').innerHTML=tools.map(t=>{
    const m=CAT_META[t.cat];
    return`<div class="tool-card" data-cat="${t.cat}">
      <div class="tool-name-en">${esc(t.en)}</div>
      <div class="tool-name-zh">${esc(t.zh)}</div>
      <div class="tool-desc">${esc(t.desc)}</div>
      <div class="tool-footer">
        <span class="tool-cat ${m.cls}">${m.label}</span>
        <a href="${t.url}" target="_blank" rel="noopener" class="tool-link">官網 →</a>
      </div>
    </div>`;
  }).join('');
}
function filterTool(cat){activeCat=cat;renderAITools()}
renderAITools();

// ── Load data.json ──
fetch('https://sssunwl.github.io/AINewsSuni/data.json?_='+Date.now())
  .then(r=>r.json())
  .then(d=>{
    document.getElementById('liveTag').textContent='最後更新：'+(d.updated||'—');

    // AI熱議 sections
    const news=d.news||[];
    document.getElementById('cNews').textContent=news.length;
    document.getElementById('listNews').innerHTML=news.length
      ?news.map(n=>newsCard(n,'b-src',n.source)).join('')
      :emptyState('今日暫無最新 AI 新聞');

    const major=d.major||[];
    document.getElementById('cMajor').textContent=major.length;
    document.getElementById('listMajor').innerHTML=major.length
      ?major.map(n=>newsCard(n,'b-major',n.source||'大廠')).join('')
      :emptyState('今日無大廠重大動態');

    const tools=d.tools||[];
    document.getElementById('cTools').textContent=tools.length;
    document.getElementById('listTools').innerHTML=tools.length
      ?tools.map(t=>toolCard(t)).join('')
      :emptyState('今日無新工具上架');

    const sun=[...(d.suniverse_news||[]),...(d.suniverse_tools||[])];
    document.getElementById('cSun').textContent=sun.length;
    document.getElementById('listSun').innerHTML=sun.length
      ?[...(d.suniverse_news||[]).map(n=>newsCard(n,'b-sun','🚩 SS 相關')),
         ...(d.suniverse_tools||[]).map(t=>toolCard(t))].join('')
      :emptyState('今日無 Suniverse 相關應用機會');

    const pick=d.pick;
    document.getElementById('pickWrap').innerHTML=pick
      ?`<div class="card pick">
          <div class="meta"><span class="badge b-pick">💡 今日精選</span></div>
          <div class="ctitle"><a href="${pick.link}" target="_blank" rel="noopener">${esc(pick.title)}</a></div>
          ${pick.summary?`<div class="csub">${esc(pick.summary)}</div>`:''}
        </div>`
      :emptyState('今日無精選');

    const ideas=d.steve_ideas||[];
    document.getElementById('listIdeas').innerHTML=ideas.length
      ?ideas.map((idea,i)=>`<div class="card">
          <div class="meta"><span class="badge b-idea">${['1️⃣','2️⃣','3️⃣'][i]||'💡'} 機會</span></div>
          <div class="ctitle" style="color:var(--gold)">${esc(idea.title)}</div>
          <div class="csub">${esc(idea.detail)}</div>
        </div>`).join('')
      :emptyState('今日機會分析載入中，請稍後再試');

    // Calendar: populate calData from history
    calData = d.history || {};
    // Also add today's data if not already in history
    if(d.updated){
      const todayKey=d.updated.split(' ')[0];
      if(todayKey&&!calData[todayKey]){
        calData[todayKey]={news:d.news,tools:d.tools,suniverse_news:d.suniverse_news,major:d.major,pick:d.pick};
      }
    }
    const now=new Date();
    calYear=now.getFullYear();calMonth=now.getMonth();
    renderCal();
  })
  .catch(()=>{
    document.getElementById('liveTag').textContent='資料載入失敗，請稍後重試';
    const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();
    renderCal();
  });
</script>
<script src="../assets/site.js"></script>
</body>
