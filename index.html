<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AISUN! · AI 不難，看我做一次你就會</title>
<meta name="description" content="用真實做過的專案教你用 AI：8 格學習路線、每天一招、Prompt 卡、真實案例和每日 AI 新聞。">
<meta property="og:title" content="AISUN! · AI 不難，看我做一次你就會">
<meta property="og:description" content="用真實做過的專案教你用 AI：8 格學習路線、每天一招、Prompt 卡、真實案例和每日 AI 新聞。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Fredoka:wght@500;600;700&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.grid{max-width:1280px;margin:0 auto;padding:24px 24px 10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:118px;gap:18px}
.t h2{font-size:24px;font-weight:800;line-height:1.3;margin-top:12px}
.hero{grid-column:span 4;grid-row:span 3;background:var(--sun);--sc:var(--cob);padding:34px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .biglogo{position:absolute;right:34px;top:26px;font-size:clamp(64px,8vw,120px);z-index:2;transform:rotate(-4deg)}
.hero h1{position:relative;z-index:2;font-size:clamp(38px,4.8vw,70px);font-weight:800;line-height:1.14}
.hero h1 em{font-style:normal;display:inline-block;background:var(--cob);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 14px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
.hero p{position:relative;z-index:2;font-size:17px;margin-top:14px;opacity:.85}
.bub{position:absolute;z-index:3;right:46px;top:46%;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-weight:800;font-size:15px;animation:wob 3s ease-in-out infinite;box-shadow:3px 3px 0 var(--ink)}
.bub:after{content:"";position:absolute;left:24px;bottom:-15px;width:22px;height:22px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.news{grid-column:span 2;grid-row:span 3;background:var(--cor);--sc:var(--sun);color:#fff;display:flex;flex-direction:column}
.news .head{font-family:"Bangers";font-size:46px;line-height:1;margin-top:12px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.news ul{flex:1}.news .lb{align-self:flex-start}
.news li{list-style:none;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:9px 11px;margin-top:10px;font-size:13.5px;line-height:1.45;display:flex;gap:9px;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.news li:nth-child(odd){transform:rotate(-1deg)}.news li:nth-child(even){transform:rotate(1deg)}
.news li:hover{transform:scale(1.03) rotate(0)}
.news li a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news li i{font-style:normal;flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.news .all{margin-top:12px;font-weight:800;font-size:14px;color:#fff;border-bottom:2px solid #fff;align-self:flex-start}
.news .upd{font-size:12px;opacity:.85;margin-top:4px}
.vid{grid-column:span 2;grid-row:span 3;background:var(--lil);--sc:var(--mint)}
.reel{display:flex;gap:10px;margin-top:12px}
.reel span{flex:1;aspect-ratio:9/14;border:3px solid var(--ink);border-radius:var(--r-in);display:grid;place-items:center;font-size:20px;box-shadow:3px 3px 0 var(--ink);transition:.25s cubic-bezier(.3,1.6,.5,1);background:#fff}
.reel span:nth-child(1){background:var(--sun)}.reel span:nth-child(2){transform:translateY(8px)}.reel span:nth-child(3){background:var(--cor);color:#fff}
.reel span:hover{transform:rotate(-5deg) scale(1.07)}
.vid .sec2{position:absolute;right:22px;top:22px;font-family:"Fredoka";font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.pcard{grid-column:span 2;grid-row:span 3;background:#fff;--sc:var(--cor)}
.pcard .cnt{font-family:"Bangers";font-size:64px;line-height:1;margin-top:10px;color:var(--cob)}
.pcard .thumbs{position:absolute;right:18px;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pcard .thumbs img{aspect-ratio:1;object-fit:cover;border:2.5px solid var(--ink);border-radius:10px;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.pcard .thumbs img:nth-child(odd){transform:rotate(-3deg)}.pcard .thumbs img:nth-child(even){transform:rotate(3deg)}
.pcard:hover .thumbs img{transform:rotate(0) scale(1.05)}
.path{grid-column:span 2;grid-row:span 3;background:var(--mint);--sc:var(--lil)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.steps a{aspect-ratio:1;border:3px solid var(--ink);border-radius:var(--r-in);background:#fff;display:grid;place-items:center;font-family:"Bangers";font-size:26px;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.steps a:nth-child(-n+2){background:var(--sun)}
.steps a:hover{transform:rotate(-8deg) scale(1.08);background:var(--cor);color:#fff}
.case{grid-column:span 3;grid-row:span 2;background:var(--peach);--sc:var(--cor)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-right:60px}
.chips a{background:#fff;border:2.5px solid var(--ink);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.chips a:hover{background:var(--cob);color:#fff;transform:rotate(-4deg) scale(1.06)}
.boom{position:absolute;right:-14px;top:-14px;width:118px;height:118px;background:var(--sun);clip-path:polygon(50% 0,61% 30%,95% 20%,72% 48%,100% 70%,64% 68%,58% 100%,44% 72%,10% 92%,28% 60%,0 38%,34% 36%);display:grid;place-items:center;font-family:"Bangers";font-size:24px;animation:pulse 1.8s ease-in-out infinite}
.boom b{transform:rotate(-10deg)}
.kit{grid-column:span 3;grid-row:span 2;background:var(--cob);--sc:var(--sun);color:#fff;display:flex;align-items:center;gap:22px;padding:22px 40px}
.gift{flex:none;width:104px;height:104px;border-radius:24px;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;transform:rotate(-8deg);animation:bob 3s ease-in-out infinite;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.gift .logo{font-size:40px}
.kit .soon{display:inline-block;margin-top:12px;background:#fff;color:var(--ink);border:3px dashed var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px}
.want .lb{background:var(--mint)}
.want{grid-column:span 6;grid-row:span 2;background:#fff;--sc:var(--mint);--rad:6px 44px 6px 44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:26px;align-items:start}
.want h2{font-size:clamp(26px,3vw,34px)}
.want .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.want .opts button{font:inherit;font-size:15px;font-weight:800;background:var(--bg);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.2s cubic-bezier(.3,1.6,.5,1)}
.want .opts button:hover{transform:rotate(-3deg)}
.want .opts button.on{background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
.want .out .prompt{margin-top:0;max-height:118px;overflow:auto}
.want .out .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.want .out .row a{font-size:13.5px;font-weight:800;border-bottom:2px solid var(--ink)}
.steps+.zero{display:inline-block;margin-top:12px;font-size:14px;font-weight:800;border-bottom:2px solid var(--ink)}
@media(max-width:900px){.want{grid-template-columns:1fr;--rad:6px 30px 6px 30px}.grid{grid-template-columns:1fr 1fr;grid-auto-rows:auto;padding:18px 16px;gap:20px}.grid>*{grid-column:span 2!important;grid-row:auto!important;min-height:220px}.hero{min-height:440px;padding:26px}.hero .biglogo{right:20px;top:20px;font-size:64px}.bub{display:none}.pcard{min-height:340px}.kit{padding:24px;flex-direction:column;align-items:flex-start;--rad:44px}.chips{padding-right:0;margin-top:18px}}
</style>
</head>
<body data-root="" data-page="home">
<main class="grid">
  <div class="t hero dots r-a rise"><div class="burst"></div>
    <span class="biglogo logo" aria-hidden="true"></span>
    <div class="bub">今天又用 AI 做出一個東西！</div>
    <h1>AI 不難，<br><em>看我做</em>一次<br>你就會。</h1>
    <p>每天一招，用真實例子教你把 AI 用在工作和生活。</p></div>
  <section class="t news r-b rise" aria-label="今日 AI 新聞"><span class="lb">今日頭條</span><div class="head">AI NEWS!</div>
    <ul id="hnews"><li><i style="background:var(--sun)">…</i>載入中</li></ul>
    <a class="all" href="news/">看今天全部 →</a><span class="upd" id="hupd"></span></section>
  <section class="t want rise" aria-label="按情境找"><div><span class="lb">按情境找</span><h2>我想用 AI……</h2><div class="opts" id="wopts"></div></div><div class="out" id="wout"></div></section>
  <a class="t vid dots r-c rise" href="tips/"><span class="lb">▶ 60 秒學一招</span><span class="sec2">0:58</span><h2>每天一招，<br>短片學會</h2><div class="reel" aria-hidden="true"><span>▶</span><span>▶</span><span>▶</span></div><span class="lb" style="margin-top:16px;background:var(--sun)">新系列：省 Token 6 招</span></a>
  <a class="t pcard r-d rise" href="prompts/"><span class="lb">✦ Prompt 卡</span><h2>複製就能用<br>的提示詞</h2><div class="cnt" id="pcnt"></div><div class="thumbs" id="pthumbs"></div></a>
  <section class="t path r-e rise" aria-label="學習路線"><span class="lb">學習路線 8 格</span><h2>8 格，<br>從零到第一個作品</h2><div class="steps" id="hsteps"></div><a class="zero" href="learn/#s0">第一次用 AI？先看第 0 格 →</a></section>
  <section class="t case dots r-f rise" aria-label="真實案例"><span class="boom" aria-hidden="true"><b>真的!</b></span><span class="lb">真實案例</span><h2><a href="cases/">不是範例，是我真的做出來的東西 →</a></h2><div class="chips" id="hcases"></div></section>
  <section class="t kit r-g rise" aria-label="AI OS 入門包"><div class="gift" aria-hidden="true"><span class="logo"><span class="bang-i"><span class="bar"></span><span class="sunny"><span class="rays"></span><span class="core"></span></span></span></span></div>
    <div><span class="lb">AI OS 入門包</span><h2>5 份檔案，貼進 AI 就能開始建你自己的 AI 系統</h2><span class="soon">準備上架中</span></div></section>
</main>
<script src="assets/site.js"></script>
<script>
document.querySelector('.biglogo').innerHTML=AISUN.LOGO;AISUN.rays();
const E=AISUN.esc;
// 按情境找
const WANT=[
 {k:'寫訊息、文案',p:'我要寫〔什麼：例如 IG 貼文／給客人的回覆／活動通知〕，給〔誰看〕。重點是〔你想說的事，口語也可以〕。語氣〔輕鬆／專業〕，〔字數〕字以內。先給我兩個版本，並說明差別。',q:'文案',c:'貼文'},
 {k:'整理資料',p:'下面是一堆〔筆記／對話紀錄／表格內容〕。幫我整理成〔清單／表格〕，分類後把最重要的排前面。看不懂或資料互相矛盾的地方直接標出來，不要自己補。\n\n〔貼上內容〕',q:'整理',c:'整理'},
 {k:'做圖',p:'幫我寫一段給 AI 生圖用的描述：主題是〔主題〕，用途是〔IG 貼文／海報／簡報封面〕，比例〔3:4／16:9〕。寫清楚主體、背景、光線、顏色和風格，最後列出「不要出現」的東西（例如多餘文字、浮水印）。',q:'照片',c:'影片'},
 {k:'做短片',p:'我想拍一支 30 秒的短片，主題是〔主題〕，給〔誰看〕。幫我寫分段腳本：每段幾秒、畫面拍什麼、字幕寫什麼。開頭 3 秒要讓人停下來，結尾給一個明確的動作。',q:'影片',c:'影片'},
 {k:'規劃旅行',p:'我要去〔地點〕〔天數〕天，同行〔誰〕，喜歡〔例如：吃、走路少、拍照〕。幫我排每天的行程，寫交通方式和大概時間，最後列出哪些資訊要自己再確認（開放時間、要不要預約）。',q:'旅行',c:'潛'},
 {k:'自動化重複工作',p:'我每〔天／週〕都要做〔重複的事〕，步驟是〔簡單描述〕。幫我判斷哪些步驟可以交給 AI 或自動化工具、哪些一定要留給人決定，並建議從哪一步開始最簡單。',q:'自動',c:'自動'}];
const wo=document.getElementById('wopts'),wout=document.getElementById('wout');
function showWant(i){const w=WANT[i];wo.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',i===j));
 wout.innerHTML=`<div class="prompt" id="wp">${E(w.p)}</div><div class="row"><button class="btn sm" data-copy="wp">複製指令</button><a href="prompts/#q=${encodeURIComponent(w.q)}">相關 Prompt 卡</a><a href="cases/#q=${encodeURIComponent(w.c)}">相關案例</a></div>`}
wo.innerHTML=WANT.map((w,i)=>`<button type="button">${w.k}</button>`).join('');
wo.onclick=e=>{const b=e.target.closest('button');if(b)showWant([...wo.children].indexOf(b))};showWant(0);
// 8 格
const STEPS=['為什麼','名詞速查','怎麼開始','六層架構','走一遍','東西放哪','常踩的坑','心態'];
document.getElementById('hsteps').innerHTML=STEPS.map((s,i)=>`<a href="learn/#s${i+1}" title="第 ${i+1} 格：${s}">${i+1}</a>`).join('');
// 今日新聞
fetch('https://sssunwl.github.io/AINewsSuni/data.json?_='+Date.now()).then(r=>r.json()).then(d=>{
 const items=[...(d.news||[]),...(d.major||[])].slice(0,3),bg=['var(--sun)','var(--peach)','var(--mint)'],ic=['新','!','看'];
 document.getElementById('hnews').innerHTML=items.length?items.map((n,i)=>`<li><i style="background:${bg[i]}">${ic[i]}</i><a href="${E(n.link)}" target="_blank" rel="noopener">${E(n.title)}</a></li>`).join(''):'<li>今天還沒有新聞</li>';
 document.getElementById('hupd').textContent=d.updated?'更新：'+d.updated:'';
}).catch(()=>{document.getElementById('hnews').innerHTML='<li><a href="news/">新聞暫時載入不到，點這裡看新聞頁</a></li>'});
// Prompt 卡
fetch('data/prompts.json').then(r=>r.json()).then(list=>{
 const p=list.filter(x=>x.type==='Prompt');document.getElementById('pcnt').textContent=p.length+' 張';
 document.getElementById('pthumbs').innerHTML=p.filter(x=>x.img).slice(0,4).map(x=>`<img src="${E(x.img)}" alt="" loading="lazy">`).join('');
});
// 案例
const SHORT={'rental-dashboard':'租車集團儀表板','surf-booking':'衝浪教練預約','kol-content':'影片變文章','dive-db':'自動潛水雜誌','travel-vlog':'AI 剪旅行影片','kids-games':'小孩網頁遊戲','token-budget':'額度老是爆','lofi-44days':'做完卻沒發'};
fetch('data/cases.json').then(r=>r.json()).then(list=>{
 document.getElementById('hcases').innerHTML=list.filter(c=>SHORT[c.id]).map(c=>`<a href="cases/#${c.id}">${SHORT[c.id]}</a>`).join('');
});
</script>
</body>
</html>
