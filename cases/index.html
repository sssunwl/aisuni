<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真實案例 · AISUN!</title>
<meta name="description" content="不是範例，是真的做出來、還在跑的專案：每個案例都寫下學到什麼、踩過的坑，和可以直接複製的指令。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Fredoka:wght@500;600;700&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
.cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.cs .stat{font-size:12px;margin-left:4px}
.cs .who{font-size:13px;font-weight:700;color:var(--mu);margin-top:-2px}
.cs .pb{font-size:14.5px;margin-top:8px}
.cs .detail h4{font-size:14px;font-weight:800;margin:14px 0 4px}
.cs .detail ol{padding-left:20px;font-size:14px}.cs .detail ol li{margin:3px 0}
.cs .res{background:rgba(255,255,255,.7);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px}
.cs .reuse{margin-top:12px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px}
.cs .reuse b{color:var(--sun)}
.cs.hl{outline:4px solid var(--cor);outline-offset:4px}
</style>
</head>
<body data-root="../" data-page="cases">
<div class="phead"><div class="t r-f rise dots" style="background:var(--peach);--sc:var(--cor)"><div class="burst"></div><span class="big" aria-hidden="true">REAL!</span><span class="lb">真實案例</span><h1>不是範例，<br>是真的做出來的東西</h1><p>每一個都是實際做過、很多還在每天跑的專案。客戶和品牌用行業名代替，數字只寫結論。每個案例都寫了問題、做法、結果、學到什麼，還有一段可以直接複製的指令。</p></div></div>
<main class="wrap">
 <div class="fbar" id="cats"></div>
 <div class="fbar" style="margin-top:-6px"><input class="search" id="q" type="search" placeholder="搜尋案例、專案、關鍵字…" aria-label="搜尋"></div>
 <div class="cards" id="list"></div><div class="empty" id="empty">沒有符合的案例</div>
</main>
<script src="../assets/site.js"></script>
<script>
const BG=['var(--sun)','var(--mint)','var(--lil)','var(--peach)','#fff'],SC=['var(--cob)','var(--lil)','var(--cor)','var(--cob)','var(--cor)'],RD=['r-a','r-e','r-c','r-f','r-b','r-h','r-d'];
const E=AISUN.esc;
let ALL=[],cat='all',q='';
function render(){
 const L=ALL.filter(c=>(cat==='all'||c.cat===cat)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=L.map((c,i)=>`<article class="t card cs ${RD[i%7]} rise" id="${c.id}" style="background:${BG[i%5]};--sc:${SC[i%5]}">
  <span class="lb">${E(c.cat)}</span><span class="tag stat">${E(c.status)}</span>
  <h3>${E(c.title)}</h3><p class="who">${E(c.who)}</p><p class="pb">${E(c.problem)}</p>
  <button class="more">看怎麼做的 ▾</button><div class="detail">
   <h4>怎麼做</h4><ol>${c.steps.map(x=>`<li>${E(x)}</li>`).join('')}</ol>
   <h4>結果</h4><p class="res">${E(c.result)}</p>
   <h4>學到什麼</h4><ul>${c.lessons.map(x=>`<li>${E(x)}</li>`).join('')}</ul>
   ${c.prompt?`<h4>可以直接複製的指令</h4><div class="prompt" id="cp-${c.id}">${E(c.prompt)}</div><button class="btn sm" data-copy="cp-${c.id}">複製指令</button>`:''}
   ${c.note?`<p class="m">${E(c.note).replace(/cases\/([\w-]+)\.md/,'<a href="$1.html" target="_blank">完整診斷長文</a>')}</p>`:''}
   ${c.reuse?`<p class="reuse"><b>可以變成：${E(c.reuse.kind)}</b>　${E(c.reuse.text)}</p>`:''}
  </div></article>`).join('');
 document.getElementById('empty').style.display=L.length?'none':'block';
 AISUN.rise();
}
document.addEventListener('click',e=>{const b=e.target.closest('.more');if(b){const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'收起 ▴':'看怎麼做的 ▾'}});
fetch('../data/cases.json').then(r=>r.json()).then(list=>{ALL=list;
 const el=document.getElementById('cats'),cats=['all',...new Set(list.map(c=>c.cat))];
 el.innerHTML=cats.map(v=>`<button class="chip${v===cat?' on':''}" data-v="${E(v)}">${v==='all'?'全部 '+list.length:E(v)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.v;el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()};
 const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith('q=')){q=h.slice(2).toLowerCase();document.getElementById('q').value=h.slice(2)}
 render();
 if(h&&!h.startsWith('q=')){const c=document.getElementById(h);if(c){c.classList.add('open','hl','in');c.querySelector('.more').textContent='收起 ▴';setTimeout(()=>c.scrollIntoView({block:'start'}),100)}}
});
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
</script>
</body>
</html>
